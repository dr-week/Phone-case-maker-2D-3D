<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c0e" />
      <stop offset="50%" stop-color="#0e1518" />
      <stop offset="100%" stop-color="#06090a" />
    </linearGradient>
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9ff3d" />
      <stop offset="100%" stop-color="#3ed3ff" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ed3ff" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="240" cy="190" r="160" fill="#c9ff3d" opacity="0.06" filter="url(#glow)" />
  <circle cx="980" cy="140" r="180" fill="#3ed3ff" opacity="0.07" filter="url(#glow)" />

  <!-- Logo Mark Graphic Container -->
  <g transform="translate(110, 95)">
    <!-- Outer CAD Calibration Ring -->
    <circle cx="95" cy="95" r="88" fill="none" stroke="#223035" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="95" cy="95" r="76" fill="#11181b" stroke="#33464d" stroke-width="1.5" />
    
    <!-- Precision Crosshairs -->
    <line x1="95" y1="0" x2="95" y2="190" stroke="rgba(62, 211, 255, 0.25)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="95" x2="190" y2="95" stroke="rgba(62, 211, 255, 0.25)" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Turbine Blade Apertures -->
    <g fill="#c9ff3d" filter="url(#glow)">
      <path id="coreBlade" d="M95 95C84 86 78 72 81 58C86 40 102 29 119 32C132 34 141 42 147 53C125 47 105 56 95 72C90 81 90 89 95 95Z" fill="url(#primaryNeon)"/>
      <use href="#coreBlade" transform="rotate(72 95 95)"/>
      <use href="#coreBlade" transform="rotate(144 95 95)"/>
      <use href="#coreBlade" transform="rotate(216 95 95)"/>
      <use href="#coreBlade" transform="rotate(288 95 95)"/>
    </g>

    <!-- Center Pivot Jewel -->
    <circle cx="95" cy="95" r="9" fill="#090d0f" stroke="#c9ff3d" stroke-width="2.5" />
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(360, 135)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#142217" stroke="#2e4d20" stroke-width="1"/>
    <text x="140" y="17" text-anchor="middle" fill="#c9ff3d" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">
      ENGINEERING STUDIO · V0.1.0
    </text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      Case<tspan fill="url(#primaryNeon)">Forge</tspan> CAD
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" fill="#90a0a5" font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      Enterprise Parametric 2D Drafting &amp; 3D Fabrication Engine for Smartphones
    </text>

    <!-- Spec Metrics Pill Bar -->
    <g transform="translate(0, 150)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="32" rx="6" fill="#101618" stroke="#25353a" stroke-width="1"/>
      <text x="90" y="20" text-anchor="middle" fill="#3ed3ff" font-family="'DM Mono', monospace, sans-serif" font-size="12" font-weight="600">
        ±0.05mm TOLERANCE
      </text>

      <!-- Pill 2 -->
      <rect x="195" y="0" width="190" height="32" rx="6" fill="#101618" stroke="#25353a" stroke-width="1"/>
      <text x="290" y="20" text-anchor="middle" fill="#c9ff3d" font-family="'DM Mono', monospace, sans-serif" font-size="12" font-weight="600">
        LAYA DECISION CORE
      </text>

      <!-- Pill 3 -->
      <rect x="400" y="0" width="190" height="32" rx="6" fill="#101618" stroke="#25353a" stroke-width="1"/>
      <text x="495" y="20" text-anchor="middle" fill="#edf0ed" font-family="'DM Mono', monospace, sans-serif" font-size="12" font-weight="600">
        THREE.JS + BLENDER IPC
      </text>
    </g>
  </g>

  <!-- Subtle bottom border line -->
  <line x1="0" y1="379" x2="1200" y2="379" stroke="#1d282c" stroke-width="1" />
</svg>
